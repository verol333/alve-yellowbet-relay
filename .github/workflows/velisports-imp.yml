name: velisports-imp
on:
  workflow_dispatch:
    inputs:
      url: { required: true }
      token: { required: false }
jobs:
  imp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q curl_cffi
      - name: probe
        env:
          URL: ${{ inputs.url }}
          TOKEN: ${{ inputs.token }}
        run: |
          python - <<'PY'
          import os, curl_cffi
          h = {
            "accept": "application/json, text/plain, */*",
            "origin": "https://launcher.velisports.com",
            "referer": "https://launcher.velisports.com/",
          }
          if os.environ.get("TOKEN"): h["authorization"] = "Bearer " + os.environ["TOKEN"]
          for imp in ["chrome", "safari", "firefox"]:
              try:
                  r = curl_cffi.get(os.environ["URL"], headers=h, impersonate=imp, timeout=25)
                  print("RESULT", imp, r.status_code, repr(r.text[:200]))
              except Exception as e:
                  print("RESULT", imp, "ERR", str(e)[:200])
          PY
