name: velisports-probe
on:
  workflow_dispatch:
    inputs:
      url:
        required: true
      token:
        required: false
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          curl -s -o body.txt -w "HTTP %{http_code}\n" "${{ github.event.inputs.url }}" \
            -H "accept: application/json, text/plain, */*" \
            -H "origin: https://launcher.velisports.com" \
            -H "referer: https://launcher.velisports.com/" \
            -H "authorization: Bearer ${{ github.event.inputs.token }}" \
            -H "user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36"
          echo "--- first 800 chars ---"
          head -c 800 body.txt
